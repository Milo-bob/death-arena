<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DeathArena - Download</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05060f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  @font-face { font-family: "Pixelify Sans"; src: url("assets/fonts/PixelifySans.ttf"); }
  @font-face { font-family: "Pixel Digits"; src: url("assets/fonts/Silkscreen.ttf"); unicode-range: U+0030-0039; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #05060f; color: #e5fffe; font-family: "Pixel Digits", "Pixelify Sans", monospace; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px 16px; text-align: center; }
  main { width: min(560px, 100%); }
  img { width: 128px; height: 128px; image-rendering: pixelated; border: 3px solid #3dff8a; margin-bottom: 18px; }
  h1 { margin: 0 0 6px; font-size: clamp(34px, 9vw, 52px); letter-spacing: 2px; color: #ffbb00; font-weight: 600; }
  p { margin: 0 0 26px; font-size: 18px; color: #8a93a8; line-height: 1.4; }
  button { display: block; width: 100%; padding: 26px 16px; font: inherit; font-size: clamp(28px, 8vw, 44px); letter-spacing: 2px; cursor: pointer;
    color: #05060f; background: #3dff8a; border: 4px solid #e5fffe; box-shadow: 0 0 0 4px #05060f, 0 0 28px #3dff8a88; }
  button:hover { background: #7dffb0; }
  button:active { transform: translateY(2px); }
  button:disabled { background: #262b3d; color: #8a93a8; border-color: #505870; box-shadow: none; cursor: default; transform: none; }
  #note { margin: 22px 0 0; font-size: 17px; color: #ffbb00; line-height: 1.5; min-height: 26px; }
  #sub { margin: 12px 0 0; font-size: 14px; color: #8a93a8; }
</style>
</head>
<body>
<main>
  <img src="icons/icon-512.png" alt="">
  <h1>DEATHARENA</h1>
  <p>Download the app. It runs offline and updates itself.</p>
  <button id="btn" type="button">DOWNLOAD</button>
  <div id="note"></div>
  <div id="sub"></div>
</main>
<script>
(function () {
  var btn = document.getElementById('btn'), note = document.getElementById('note'), sub = document.getElementById('sub'), prompt = null;
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var standalone = (window.matchMedia && matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches) || navigator.standalone === true;
  function hint() {
    note.textContent = ios
      ? 'Tap the SHARE button of Safari (square with an arrow), then "Add to Home Screen".'
      : 'Open your browser menu and choose "Install DeathArena" or "Install app" (Chrome, Edge) or "Add to Home Screen" (mobile).';
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  if (standalone) { btn.textContent = 'ALREADY INSTALLED'; btn.disabled = true; note.textContent = 'Open DeathArena from your desktop or home screen.'; return; }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); prompt = e; note.textContent = ''; });
  window.addEventListener('appinstalled', function () { prompt = null; btn.textContent = 'INSTALLED!'; btn.disabled = true; note.textContent = 'Open DeathArena from your desktop or home screen.'; sub.textContent = ''; });
  btn.addEventListener('click', function () {
    if (prompt) { var p = prompt; prompt = null; try { p.prompt(); } catch (e) { hint(); } }
    else hint();
  });
})();
</script>
</body>
</html>
