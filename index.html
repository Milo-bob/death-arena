<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>DeathArena</title>
        <link rel="manifest" href="manifest.webmanifest">
        <meta name="theme-color" content="#05060f">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-title" content="DeathArena">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <link rel="apple-touch-icon" href="icons/icon-180.png">
        <link rel="icon" type="image/png" href="icons/icon-192.png">
        <style>
            @font-face {
                font-family: "Pixelify Sans";
                src: url("assets/fonts/PixelifySans.ttf");
            }
            /* Ziffern aus Silkscreen: pixelig wie die Buchstaben, aber besser unterscheidbar */
            @font-face {
                font-family: "Pixel Digits";
                src: url("assets/fonts/Silkscreen.ttf");
                unicode-range: U+0030-0039;
            }
            html, body {
                margin: 0;
                height: 100%;
                overflow: hidden;
                overscroll-behavior: none;
                touch-action: none;                 /* Wischen gehoert dem Spiel (Menues scrollen), nicht der Seite */
                background: #111;
            }
            body {
                display: flex;
                align-items: center;
                justify-content: center;
            }
            /* Das Spiel skaliert mit dem Fenster und behält das Seitenverhältnis 16:9 (Menüs; der Lauf sitzt darin als 4:3) */
            canvas {
                width: min(100vw, calc(100vh * 16 / 9));
                height: min(100vh, calc(100vw * 9 / 16));
                background: #000;
                image-rendering: pixelated;
            }
        </style>
    </head>
    <body>
        <canvas id="gameCanvas"></canvas>

        <script src="js/style.js"></script>
