<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>DeathArena</title>
        <style>
            @font-face {
                font-family: "Pixelify Sans";
                src: url("assets/fonts/PixelifySans.ttf");
            }
            html, body {
                margin: 0;
                height: 100%;
                overflow: hidden;
                background: #111;
            }
            body {
                display: flex;
                align-items: center;
                justify-content: center;
            }
            /* Das Spiel skaliert mit dem Fenster und behält das Seitenverhältnis 16:9 (Menüs; der Lauf sitzt darin als 4:3) */
            canvas {
                width: min(100vw, calc(100vh * 16 / 9));
                height: min(100vh, calc(100vw * 9 / 16));
                background: #000;
                image-rendering: pixelated;
            }
        </style>
    </head>
    <body>
        <canvas id="gameCanvas"></canvas>

        <script src="js/style.js"></script>
        <script src="js/config.js"></script>
        <script src="js/art_manifest.js"></script>
        <script src="js/util.js"></script>
        <script src="js/assets.js"></script>

        <script src="js/runstats.js"></script>
        <script src="js/transfer.js"></script>
        <script src="js/cosmetics.js"></script>
        <script src="js/cosmetics2.js"></script>
        <script src="js/heroes.js"></script>
        <script src="js/input.js"></script>
        <script src="js/nipplejs.min.js"></script>
        <script src="js/touch.js"></script>
        <script src="js/sfx.js"></script>
        <script src="js/music.js"></script>
        <script src="js/weapons.js"></script>
        <script src="js/arsenal.js"></script>
        <script src="js/juice.js"></script>
        <script src="js/player.js"></script>
        <script src="js/enemies.js"></script>
        <script src="js/bosses.js"></script>
        <script src="js/xp.js"></script>
        <script src="js/milestonefx.js"></script>
        <script src="js/mapspecial.js"></script>
        <script src="js/mapenv.js"></script>
        <script src="js/safespot.js"></script>
        <script src="js/mapfx.js"></script>
        <script src="js/meteors.js"></script>
        <script src="js/obstacles.js"></script>
        <script src="js/tutorial.js"></script>

    </body>
</html>
