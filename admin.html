function colChart(rows, colors, unit) {      // rows: [{ l: Beschriftung, v: [Teilwerte] }], gestapelt
  const mob = window.innerWidth < 700, W = Math.max(300, Math.min(window.innerWidth >= 820 ? window.innerWidth - 300 : window.innerWidth - 50, 1140)), H = mob ? 190 : 180, padX = 6, padT = 20, padB = 22, n = rows.length;
  const tot = rows.map((r) => r.v.reduce((a, b) => a + b, 0)), mx = Math.max(2, ...tot), bw = (W - padX * 2) / n, gap = bw > 14 ? 3 : 1, step = Math.max(1, Math.ceil(n / (mob ? 7 : 14))), ch = H - padT - padB;
  let s = '<svg class="chart" style="height:' + H + 'px" viewBox="0 0 ' + W + ' ' + H + '"><line x1="0" x2="' + W + '" y1="' + (H - padB) + '" y2="' + (H - padB) + '" stroke="var(--line)"/><line x1="0" x2="' + W + '" y1="' + padT + '" y2="' + padT + '" stroke="var(--soft)" stroke-dasharray="3 4"/><text x="4" y="' + (padT - 5) + '" fill="#7f8fb0" font-size="11">max ' + mx + (unit ? ' ' + unit : '') + '</text>';
  rows.forEach((r, i) => {

    if (tot[i] && n <= 31) s += '<text x="' + (x + bw / 2) + '" y="' + (y - 4) + '" fill="var(--ice)" font-size="11" text-anchor="middle">' + tot[i] + '</text>';
    if ((n - 1 - i) % step === 0) s += '<text x="' + (x + bw / 2) + '" y="' + (H - 6) + '" fill="#7f8fb0" font-size="11" text-anchor="middle">' + esc(r.l) + '</text>';

}

  const E = S.err = S.err || { q: '', sort: 'last' }, total = list.reduce((s, e) => s + e.n, 0), day = list.filter((e) => Date.now() - new Date(e.last_at) < 864e5), vers = {};
  for (const e of list) vers[e.ver || '?'] = (vers[e.ver || '?'] || 0) + e.n;
  const topVer = Object.keys(vers).sort((a, b) => vers[b] - vers[a])[0];
  const draw = () => {
    const q = E.q.toLowerCase(), rows = list.filter((e) => !q || (e.msg + ' ' + e.ctx + ' ' + e.ua + ' ' + e.ver).toLowerCase().includes(q)).sort((a, b) => E.sort === 'n' ? b.n - a.n : String(b.last_at).localeCompare(String(a.last_at)));
    $('#ebody').innerHTML = rows.length ? rows.map((e) => '<div class="card ecard" style="margin:0 0 8px"><div class="row" style="margin:0 0 4px"><b class="err" style="flex:1;min-width:200px;word-break:break-word">' + esc(e.msg) + '</b><span class="tag yel">x' + e.n + '</span><button data-e="' + e.id + '">CLEAR</button></div>' +
      (e.ctx ? '<div class="muted" style="font-size:13px;word-break:break-word">where: ' + esc(e.ctx) + '</div>' : '') +
      '<div class="muted" style="font-size:12px">last ' + ago(e.last_at) + ' · first ' + fmtD(e.first_at) + (e.ver ? ' · version ' + esc(e.ver) : '') + '</div><div class="muted" style="font-size:11px;word-break:break-word">' + esc(e.ua) + '</div></div>').join('') : '<div class="card muted">' + (list.length ? 'Nothing matches.' : 'No errors reported. Good.') + '</div>';
    $('#ebody').querySelectorAll('[data-e]').forEach((b) => { b.onclick = () => act('Cleared', 'adm_errors_clear', { p_id: +b.dataset.e }, viewErrors); });
  };
  m.innerHTML = '<div class="muted" style="margin-bottom:8px">Reported automatically and anonymously by the game (no name, no save), at most 5 per session.</div>' +
    '<div class="kpis">' + [['Different errors', list.length], ['Times in total', total], ['New in 24 h', day.length], ['Most affected version', topVer || '-']].map(([l, v]) => '<div class="kpi"><b' + (l === 'New in 24 h' && v ? ' class="err"' : '') + '>' + esc(v) + '</b><span>' + l + '</span></div>').join('') + '</div>' +
    '<div class="row" style="margin-top:10px"><input type="search" id="eq" placeholder="Search message, place, device..." value="' + esc(E.q) + '" style="flex:1;min-width:160px"><select id="es"><option value="last"' + (E.sort === 'last' ? ' selected' : '') + '>Newest first</option><option value="n"' + (E.sort === 'n' ? ' selected' : '') + '>Most frequent</option></select>' + (list.length ? '<button id="ecl" class="warn">CLEAR ALL</button>' : '') + '</div><div id="ebody"></div>';
  $('#eq').oninput = (e) => { E.q = e.target.value; draw(); }; $('#es').onchange = (e) => { E.sort = e.target.value; draw(); }; draw();
  const c = $('#ecl'); if (c) c.onclick = () => { if (confirm('Delete all error entries?')) act('All cleared', 'adm_errors_clear', {}, viewErrors); };
}

// ====== Tabellen auf dem Handy als Karten (Beschriftungen aus der Kopfzeile) ======
function markTables() {
  document.querySelectorAll('#main table:not([data-m])').forEach((t) => {
    t.dataset.m = '1';
    const rows = Array.from(t.rows), head = rows.find((r) => r.querySelector('th'));
    if (!head || head.cells.length < 3) return;
    const labels = Array.from(head.cells).map((c) => (c.textContent || '').replace(/[▲▼]/g, '').trim());
    const hide = (t.dataset.hide || '').split(',');
    t.classList.add('rt'); head.classList.add('hd');
    for (const r of rows) { if (r === head) continue; Array.from(r.cells).forEach((c, i) => { if (c.colSpan > 1) c.classList.add('nl'); else { c.dataset.l = labels[i] || ''; if (hide.includes(labels[i])) c.classList.add('hm'); } }); }
  });
}
{ let q = 0; new MutationObserver(() => { if (!q) q = requestAnimationFrame(() => { q = 0; markTables(); }); }).observe(document.getElementById('app'), { childList: true, subtree: true }); }

const devOf = (ua, c) => { ua = String(ua || ''); const os = /iPhone|iPad|iPod/.test(ua) ? 'iPhone/iPad' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows' : /Mac/.test(ua) ? 'Mac' : /Linux/.test(ua) ? 'Linux' : 'device'; const br = /Edg\//.test(ua) ? 'Edge' : /Firefox/.test(ua) ? 'Firefox' : /Chrome|CriOS/.test(ua) ? 'Chrome' : /Safari/.test(ua) ? 'Safari' : ''; return os + (br ? ', ' + br : '') + (c && c.pwa ? ' (installed app)' : ''); };
const BST = [['new', 'NEW'], ['working', 'IN PROGRESS'], ['done', 'DONE'], ['wontfix', "WON'T FIX"]];
async function viewBugs(m) {
  m.innerHTML = '<span class="muted">Loading...</span>';
  let list; try { list = await rpc('adm_bugs'); } catch (e) { m.innerHTML = '<div class="card"><span class="err">' + esc(e.message) + '</span><div class="muted" style="margin-top:4px">Needs tools/supabase_admin3.sql in Supabase, and the updated game (Settings > Report a bug).</div></div>'; return; }
  NOTIF.bugsNew = list.filter((b) => b.status === 'new').length; updateBadges();
  const F = S.bf = S.bf || 'open', n = (st) => list.filter((b) => b.status === st).length;
  const rows = list.filter((b) => F === 'all' || (F === 'open' ? b.status === 'new' || b.status === 'working' : F === 'closed' ? b.status === 'done' || b.status === 'wontfix' : b.status === F));
  m.innerHTML = '<div class="kpis">' + [['New', n('new')], ['In progress', n('working')], ['Done', n('done')], ['All', list.length]].map(([l, v], i) => '<div class="kpi"><b' + (i === 0 && v ? ' class="err"' : '') + '>' + v + '</b><span>' + l + '</span></div>').join('') + '</div>' +
    '<div class="chips" id="bfc" style="margin-top:8px">' + [['open', 'Open'], ['new', 'New'], ['closed', 'Closed'], ['all', 'All']].map(([v, l]) => '<button data-v="' + v + '" class="' + (F === v ? 'on' : '') + '">' + l + '</button>').join('') + '</div>' +
    (rows.length ? rows.map((b) => { const c = b.ctx || {}; return '<div class="card bugc ' + esc(b.kind) + ' ' + esc(b.status) + '" style="margin:0 0 8px"><div class="row" style="margin:0"><span class="tag ' + (b.kind === 'bug' ? 'err' : b.kind === 'idea' ? 'yel' : '') + '">' + esc(b.kind.toUpperCase()) + '</span><b style="flex:1;min-width:160px;word-break:break-word">' + esc(b.title) + '</b><span class="muted" style="font-size:12px">' + ago(b.created_at) + '</span></div>' +
      (b.body ? '<div style="white-space:pre-wrap;word-break:break-word;margin:6px 0">' + esc(b.body) + '</div>' : '') +
      '<div class="muted" style="font-size:12px">' + (b.name ? 'from ' + nameLink(b.name) : 'anonymous') + ' · ' + esc(devOf(c.ua, c)) + (c.ver ? ' · version ' + esc(c.ver) : '') + (c.scr ? ' · ' + esc(c.scr) : '') + (c.mode ? ' · screen "' + esc(c.mode) + '"' + (c.map ? ' on ' + esc(c.map) : '') + (c.t ? ' at ' + fmtT(c.t) : '') : '') + '</div>' +
      '<div class="chips" style="margin:8px 0 2px">' + BST.map(([v, l]) => '<button data-bs="' + b.id + '" data-v="' + v + '" class="' + (b.status === v ? 'on' : '') + '">' + l + '</button>').join('') + '</div>' +
      (b.name ? '<div class="acts"><button data-br="' + b.id + '">✉ REPLY TO ' + esc(b.name.toUpperCase()) + '</button></div>' : '') +
      '<details class="more"><summary>Note and delete' + (b.note ? ' (has note)' : '') + '</summary><textarea id="bn' + b.id + '" rows="2" maxlength="500" placeholder="Private note (only you see it)" style="font:13px/1.4 inherit">' + esc(b.note) + '</textarea><div class="acts"><button data-bn="' + b.id + '" class="on">SAVE NOTE</button><button data-bd="' + b.id + '" class="bad">DELETE</button></div></details></div>'; }).join('') : '<div class="card muted">' + (list.length ? 'Nothing in this list.' : 'No reports yet. Players send them from Settings > Report a bug (needs the updated game).') + '</div>');
  document.querySelectorAll('#bfc button').forEach((b) => { b.onclick = () => { S.bf = b.dataset.v; viewBugs(m); }; });
  m.querySelectorAll('[data-bs]').forEach((b) => { b.onclick = () => act('Marked as ' + b.textContent.toLowerCase(), 'adm_bug_set', { p_id: +b.dataset.bs, p_status: b.dataset.v }, () => viewBugs(m)); });
  m.querySelectorAll('[data-bn]').forEach((b) => { b.onclick = () => { const r = list.find((x) => x.id === +b.dataset.bn); act('Note saved', 'adm_bug_set', { p_id: r.id, p_status: r.status, p_note: $('#bn' + r.id).value.trim() }, () => viewBugs(m)); }; });
  m.querySelectorAll('[data-br]').forEach((b) => { b.onclick = () => { const r = list.find((x) => x.id === +b.dataset.br); S.msgDraft = { title: ('Re: ' + r.title).slice(0, 40), body: '' }; openPlayer(r.name); }; });
  m.querySelectorAll('[data-bd]').forEach((b) => { b.onclick = () => { if (confirm('Delete this report for good?')) act('Report deleted', 'adm_bug_delete', { p_id: +b.dataset.bd }, () => viewBugs(m)); }; });
}
async function viewErrors() {
  const m = $('#main'), T = S.bt = S.bt || 'reports';
  m.innerHTML = '<div class="pg"><h2>Bugs &amp; errors</h2><span class="muted">What players report and what the game catches by itself</span></div><div class="chips" id="bt">' + [['reports', 'Player reports' + (NOTIF.bugsNew ? ' (' + NOTIF.bugsNew + ' new)' : '')], ['auto', 'Automatic errors']].map(([v, l]) => '<button data-v="' + v + '" class="' + (T === v ? 'on' : '') + '">' + l + '</button>').join('') + '</div><div id="bbody"></div>';
  document.querySelectorAll('#bt button').forEach((b) => { b.onclick = () => { S.bt = b.dataset.v; viewErrors(); }; });
  await (T === 'reports' ? viewBugs : viewAutoErrors)($('#bbody'));
}

(async function () {
  let k = '';
  // Auto-Login: admin.html#password=<Schluessel> (der Teil nach # geht nie an den Server) oder admin.html?password=<Schluessel>; danach verschwindet er aus der Adressleiste
  try {
    const m = /[#?&]password=([^&#]+)/.exec(location.hash + '&' + location.search);
    if (m) { k = decodeURIComponent(m[1]).trim(); history.replaceState(null, '', location.pathname); }
  } catch (e) { /* egal */ }
  if (!k) k = store.get();
  if (k) { KEY = k; try { S.users = await rpc('adm_users'); store.set(k); return renderMain(); } catch (e) { KEY = ''; if (/wrong admin password/i.test(e.message)) store.del(); return renderLogin(e.message); } }
  renderLogin();
})();
