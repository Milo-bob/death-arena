<!doctype html>
<html lang="en">
<head>

<link rel="manifest" href="admin.webmanifest">
<meta name="theme-color" content="#05060f">

<style>
  :root { --ink:#05060f; --void:#070914; --panel:#0e1430; --line:#1f3a66; --cyan:#3de8ff; --cyanDark:#0d5a78; --ice:#e6fdff; --grey:#7f8fb0; --yellow:#ffd91f; --orange:#ff8a1f; --red:#ff2d3d; --green:#39ff6e; --violet:#8a4bff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--void); color:var(--ice); font:14px/1.45 "Segoe UI", system-ui, sans-serif; }
  h1 { font-size:20px; margin:0; color:var(--yellow); letter-spacing:1px; }
  h2 { font-size:16px; margin:18px 0 8px; color:var(--cyan); }
  h3 { font-size:14px; margin:0 0 6px; color:var(--yellow); }
  a { color:var(--cyan); }
  .wrap { max-width:1180px; margin:0 auto; padding:14px 16px 60px; }
  header { display:flex; align-items:center; gap:14px; flex-wrap:wrap; border-bottom:2px solid var(--line); padding:12px 16px; background:var(--ink); position:sticky; top:0; z-index:5; }
  header .sp { flex:1; }
  nav { display:flex; gap:6px; flex-wrap:wrap; }
  button, select, input, textarea { font:inherit; color:var(--ice); background:var(--ink); border:1px solid var(--cyanDark); padding:6px 10px; border-radius:3px; }
  textarea { width:100%; font:12px/1.4 Consolas, monospace; }
  input[type=text], input[type=password], input[type=number], input[type=search] { min-width:0; }
  button { cursor:pointer; border-color:var(--cyan); color:var(--cyan); }
  button:hover { background:var(--cyanDark); color:var(--ice); }
  button.on { background:var(--cyan); color:var(--ink); }
  button.warn { border-color:var(--orange); color:var(--orange); } button.warn:hover { background:#5a2a05; color:var(--ice); }
  button.bad { border-color:var(--red); color:var(--red); } button.bad:hover { background:#4a0a12; color:var(--ice); }
  button:disabled { opacity:.4; cursor:default; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:12px; margin:10px 0; }
  .grid { display:grid; gap:10px; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:6px 0; }
  .muted { color:var(--grey); } .ok { color:var(--green); } .err { color:var(--red); } .yel { color:var(--yellow); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--grey); font-weight:600; font-size:12px; white-space:nowrap; cursor:default; }
  th.s { cursor:pointer; } th.s:hover { color:var(--cyan); }
  tr.pick { cursor:pointer; } tr.pick:hover td { background:#13204a; }
  tr.sel td { background:#1a2c63; }
  .tag { display:inline-block; font-size:11px; padding:0 6px; border:1px solid currentColor; border-radius:9px; margin-right:4px; }
  .kpis { display:grid; gap:10px; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); }
  .kpi { background:var(--ink); border:1px solid var(--line); padding:8px 10px; border-radius:4px; } .kpi b { display:block; font-size:20px; color:var(--cyan); } .kpi span { color:var(--grey); font-size:12px; }
  .bar { height:10px; background:var(--cyanDark); border-radius:2px; min-width:1px; }
  .login { max-width:420px; margin:12vh auto; }
  .login input { width:100%; margin:8px 0; }
  pre { background:var(--ink); border:1px solid var(--line); padding:10px; overflow:auto; max-height:420px; font:12px/1.4 Consolas, monospace; white-space:pre-wrap; word-break:break-all; }
  #toast { position:fixed; right:16px; bottom:16px; max-width:360px; padding:10px 14px; background:var(--panel); border:1px solid var(--cyan); border-radius:4px; display:none; z-index:40; }
  #toast.bad { border-color:var(--red); }
  .chart { width:100%; height:220px; background:var(--ink); border:1px solid var(--line); border-radius:4px; }
  /* ---- Layout: schlanke Kopfzeile + Seitenleiste mit Gruppen ---- */
  header.top { gap:10px; padding:8px 16px; flex-wrap:nowrap; }
  header.top h1 { font-size:16px; white-space:nowrap; }
  header.top button { padding:4px 10px; font-size:13px; white-space:nowrap; }
  .shell { display:flex; align-items:flex-start; max-width:1380px; margin:0 auto; }
  aside#side { width:196px; flex:none; position:sticky; top:49px; align-self:flex-start; max-height:calc(100vh - 49px); overflow:auto; padding:14px 8px 20px 12px; }
  aside#side .grp { margin:0 0 14px; }
  aside#side .gl { font-size:11px; letter-spacing:1.5px; color:var(--grey); margin:0 0 4px 10px; }
  aside#side button { display:flex; align-items:center; justify-content:space-between; gap:6px; width:100%; text-align:left; border:0; border-left:3px solid transparent; border-radius:0 4px 4px 0; background:none; color:var(--ice); padding:7px 10px; font-size:13.5px; }
  aside#side button:hover { background:#13204a; color:var(--ice); }
  aside#side button.on { background:#1a2c63; border-left-color:var(--cyan); color:var(--cyan); font-weight:600; }
  .bdg { font-size:11px; min-width:20px; text-align:center; padding:0 6px; border-radius:9px; background:var(--green); color:var(--ink); font-weight:700; }
  .bdg.off { background:var(--line); color:var(--grey); }
  .shell > .wrap { flex:1; min-width:0; max-width:1180px; margin:0; }
  header.top #nt { border-radius:12px; }
  header.top #nt.on { background:var(--green); border-color:var(--green); color:var(--ink); }
  .pg { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin:2px 0 4px; }
  .pg h2 { margin:0; font-size:20px; color:var(--ice); } .pg .muted { font-size:13px; }

  .kpi.hot b { color:var(--green); }

  input.tg { appearance:none; -webkit-appearance:none; flex:none; width:36px; height:20px; padding:0; border:1px solid var(--cyanDark); border-radius:11px; background:var(--ink); position:relative; cursor:pointer; vertical-align:middle; transition:background .15s; }
  input.tg::after { content:''; position:absolute; left:2px; top:2px; width:14px; height:14px; border-radius:50%; background:var(--grey); transition:left .15s, background .15s; }
  input.tg:checked { background:var(--cyanDark); border-color:var(--cyan); }
  input.tg:checked::after { left:18px; background:var(--cyan); }
  .opt { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:7px 0; border-bottom:1px solid #16264d; }
  .opt:last-child { border-bottom:0; }
  .opt > .txt { flex:1; min-width:180px; } .opt .txt small { display:block; color:var(--grey); font-size:12px; }
  .opt .sub { flex-basis:100%; padding-left:46px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .card.hero { display:flex; align-items:center; gap:16px; flex-wrap:wrap; border-color:var(--cyanDark); }
  .card.hero.live { border-color:var(--green); }
  .pill { display:inline-block; font-size:12px; padding:1px 9px; border-radius:10px; background:#16264d; color:var(--grey); margin:2px 4px 2px 0; }
  .pill.ok { background:#0f3a24; color:var(--green); } .pill.no { background:#4a0a12; color:#ff8a93; } .pill.wait { background:#4a3a05; color:var(--yellow); }
  .cols { display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(340px, 1fr)); align-items:start; }
  .cols > .card { margin:0; }
  @media (max-width:820px) {
    .shell { display:block; }
    aside#side { width:auto; position:sticky; top:49px; z-index:4; display:flex; gap:4px; overflow-x:auto; max-height:none; padding:6px 10px; background:var(--ink); border-bottom:1px solid var(--line); }
    aside#side .grp { display:flex; gap:4px; margin:0; align-items:center; }
    aside#side .gl { display:none; }
    aside#side button { width:auto; white-space:nowrap; border-left:0; border-bottom:3px solid transparent; border-radius:4px 4px 0 0; padding:6px 10px; }
    aside#side button.on { border-bottom-color:var(--cyan); }
    header.top .hide-s { display:none; }
    header.top { flex-wrap:wrap; gap:6px; padding:6px 10px; } header.top h1 { font-size:14px; } header.top { position:static; } aside#side { top:0; max-width:100vw; }
    .cols { grid-template-columns:1fr; } .wrap { padding:10px 12px 60px; } .opt .sub { padding-left:0; }
  }
  @media (max-width:640px) { th, td { padding:4px 5px; font-size:13px; } }
</style>

<script>
'use strict';
// ====== Konfiguration: dieselbe Supabase-URL und derselbe (oeffentliche) anon-Key wie im Spiel (js/account.js) ======
// Der Schutz liegt NICHT in dieser Seite, sondern im Server: jede Funktion in tools/supabase_admin.sql prueft das Admin-Passwort (Hash in lb_admin_key).
const URL_ = 'https://kqtjtagbhaaddfqibaxh.supabase.co';
const KEY_ = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxdGp0YWdiaGFhZGRmcWliYXhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1NTAzMDQsImV4cCI6MjEwNzEyNjMwNH0.dqw0HzW7UNdr_xW7BzauWXzAMJaP7M8TcUQwe5IjC78';
// Namen wie im Spiel (js/runstats.js, config.js), nur zur Anzeige
const BOSS_NAMES = { octagon:'OCTAGON', kite:'KITE', summoner:'SUMMONER', turret:'LASER TURRET', twin:'TWINS', arena:'ARENA BOSS', reaper:'DEATH', forge:'FORGE WARDEN', colossus:'SLAG COLOSSUS', plague:'PLAGUE DRONE', spore:'SPORE MOTHER', frost:'FROST SENTINEL', wraith:'FROST WRAITH' };
const MAP_NAMES = { void:'NEON VOID', foundry:'EMBER FOUNDRY', toxic:'TOXIC CORE', cryo:'CRYO STATION' };
const WINDOW = 120;          // Sekunden je Zeitfenster (CFG.boss.steps)

// ====== Hilfen ======
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const fmtT = (t) => { t = Math.round(t || 0); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };
const fmtD = (d) => (d ? new Date(d).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' }) : '-');
const fmtN = (n) => Math.round(n || 0).toLocaleString('de-DE');
const pct = (x) => Math.round(x * 100) + '%';
const avg = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0);
const quant = (sorted, p) => (sorted.length ? sorted[Math.min(sorted.length - 1, Math.floor(p * sorted.length))] : 0);
function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => { t.style.display = 'none'; }, bad ? 6000 : 3500); }
const checksum = (s) => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h.toString(36); };
function decodeCode(code) {
  const m = /^DA1:([A-Za-z0-9+/=]+):([0-9a-z]+)$/i.exec(String(code || '').trim());
  if (!m) return null;
  try { return JSON.parse(decodeURIComponent(escape(atob(m[1])))); } catch (e) { return null; }
}
function levelOf(xp) {        // wie Save.levelInfo in js/save.js (needs: 80/120/180/500, danach +200 je Level, max 50)
  const N = [80, 120, 180, 500]; let lv = 1; xp = Math.max(0, Math.floor(xp || 0));
  const need = (l) => (l <= N.length ? N[l - 1] : N[N.length - 1] + 200 * (l - N.length));
  while (lv < 50 && xp >= need(lv)) { xp -= need(lv); lv++; }
  return lv;
}
function randomPw() { const a = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789', b = crypto.getRandomValues(new Uint8Array(12)); return Array.from(b, (x) => a[x % a.length]).join(''); }

// ====== Server ======
const store = { get: () => { try { return localStorage.getItem('da.admin') || sessionStorage.getItem('da.admin') || ''; } catch (e) { return ''; } }, set: (k) => { try { localStorage.setItem('da.admin', k); } catch (e) { /* egal */ } }, del: () => { try { localStorage.removeItem('da.admin'); sessionStorage.removeItem('da.admin'); } catch (e) { /* egal */ } } };
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let installEv = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEv = e; document.querySelectorAll('.inst').forEach((b) => { b.hidden = false; }); });
window.addEventListener('appinstalled', () => { installEv = null; document.querySelectorAll('.inst').forEach((b) => { b.hidden = true; }); });
async function installApp() {
  if (installEv) { installEv.prompt(); try { await installEv.userChoice; } catch (e) { /* egal */ } installEv = null; return; }
  alert(/iPad|iPhone|iPod/.test(navigator.userAgent) ? 'On iPhone/iPad: tap the Share button, then "Add to Home Screen".' : 'Use your browser menu: "Install app" / "Add to Home screen". (Chrome/Edge: icon in the address bar.)');
}
const instBtn = () => standalone() ? '' : '<button class="inst" onclick="installApp()"' + '>INSTALL APP</button>';
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
let KEY = '';                                         // Admin-Passwort (nur im Speicher, optional sessionStorage)
async function rpc(fn, args) {
  const res = await fetch(URL_ + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: KEY_, Authorization: 'Bearer ' + KEY_, 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ p_key: KEY }, args || {})) });
  let json = null; try { json = await res.json(); } catch (e) { /* leer */ }
  if (!res.ok) {
    const m = (json && (json.message || json.hint || json.error)) || ('HTTP ' + res.status);
    throw new Error(/not allowed/.test(m) ? 'Wrong admin password.' : /Could not find the function|schema cache/i.test(m) ? 'Server not set up: run tools/supabase_admin.sql (and tools/supabase_admin2.sql / supabase_social.sql for the newer tabs) in Supabase first.' : m);
  }
  return json;
}
async function act(label, fn, args, after) {
  try { await rpc(fn, args); toast(label); if (after) await after(); } catch (e) { toast(e.message, true); }
}

// ====== Zustand ======
const S = { tab: 'dashboard', users: null, sel: null, saves: {}, gifts: [], filter: '', sort: { k: 'created_at', d: -1 }, logs: null, logsFor: null, stat: { user: '', slot: '', map: 'all', sub: 'saves', dev: false }, allSaves: null };

// ====== Login ======
function renderLogin(msg) {
  $('#app').innerHTML = '<div class="login card"><h1>DEATHARENA ADMIN</h1><p class="muted">Enter the admin password (your dev key).</p>' +
    '<input type="password" id="pw" placeholder="Admin password" autocomplete="current-password" autofocus>' +
    '<label class="muted"><input type="checkbox" id="rem" style="min-width:0" checked> stay logged in on this device</label>' +
    '<div class="row"><button id="go" class="on">LOG IN</button>' + instBtn() + '</div><div class="err" id="lm">' + esc(msg || '') + '</div></div>';
  const go = async () => {
    KEY = $('#pw').value.trim(); if (!KEY) return;
    $('#lm').textContent = 'Checking...';
    try { S.users = await rpc('adm_users'); } catch (e) { KEY = ''; $('#lm').textContent = e.message; return; }
    if ($('#rem').checked) store.set(KEY);
    renderMain();
  };
  $('#go').onclick = go; $('#pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
}
function logout() { KEY = ''; clearInterval(NOTIF.timer); NOTIF.timer = null; store.del(); S.users = null; S.sel = null; S.logs = null; renderLogin(); }

// ====== Rahmen ======
function renderMain() {
  clearInterval(S.liveTimer); S.liveTimer = null;
  const groups = [['OVERVIEW', [['dashboard', 'Dashboard'], ['online', 'Online now']]], ['PLAYERS', [['players', 'Players'], ['create', 'Create accounts']]], ['INSIGHTS', [['stats', 'Statistics'], ['retention', 'Retention'], ['errors', 'Errors']]], ['MODERATION', [['cheats', 'Cheats'], ['guilds', 'Guilds'], ['gifts', 'Gifts & news'], ['audit', 'Action log']]], ['SETTINGS', [['alerts', 'Alerts']]]];
  const badge = (id) => id === 'online' ? '<span class="bdg' + (NOTIF.onlineN ? '' : ' off') + '" id="bd-online"' + (NOTIF.onlineN == null ? ' hidden' : '') + '>' + (NOTIF.onlineN || 0) + '</span>' : id === 'alerts' ? '<span class="bdg' + (NOTIF.on ? '' : ' off') + '" id="bd-alerts">' + (NOTIF.on ? 'ON' : 'OFF') + '</span>' : '';
  $('#app').innerHTML = '<header class="top"><h1>DEATHARENA ADMIN</h1><span class="sp"></span><span class="muted hide-s" id="cnt">' + (S.users ? S.users.length + ' accounts' : '') + '</span><button id="nt" title="Alerts on/off (details under Settings > Alerts)"></button><button id="rl">RELOAD</button><span class="hide-s">' + instBtn() + '</span><button id="lo" class="warn">LOG OUT</button></header>' +
    '<div class="shell"><aside id="side">' + groups.map(([g, items]) => '<div class="grp"><div class="gl">' + g + '</div>' + items.map(([id, l]) => '<button data-t="' + id + '" class="' + (S.tab === id ? 'on' : '') + '">' + l + badge(id) + '</button>').join('') + '</div>').join('') + '</aside><div class="wrap" id="main"></div></div>';
  document.querySelectorAll('#side button').forEach((b) => { b.onclick = () => { S.tab = b.dataset.t; renderMain(); window.scrollTo(0, 0); }; });
  const onBtn = document.querySelector('#side button.on'); if (onBtn && onBtn.scrollIntoView) onBtn.scrollIntoView({ block: 'nearest', inline: 'center' });
  $('#lo').onclick = logout;
  $('#nt').onclick = () => setNotif(!NOTIF.on); updateNotifBtn(); if (!NOTIF.timer) startPoll();
  if (NOTIF.on && !NOTIF.pushed) { NOTIF.pushed = true; pushSub(true).catch(() => {}); }
  if (!S.notes) loadNotes().then(() => { if (S.tab === 'players' && $('#ut')) drawUsers(); });
  $('#rl').onclick = async () => { try { S.users = await rpc('adm_users'); S.logs = null; S.allSaves = null; if (S.sel) await loadSel(); toast('Reloaded'); renderMain(); } catch (e) { toast(e.message, true); } };
  ({ dashboard: viewDashboard, online: viewOnline, alerts: viewAlerts, players: viewPlayers, create: viewCreate, stats: viewStats, retention: viewRetention, gifts: viewGifts, cheats: viewCheats, guilds: viewGuilds, errors: viewErrors, audit: viewAudit }[S.tab])();
}

// ====== Benachrichtigung bei neuen Konten ======
// Die Seite fragt alle 30 s die Kontoliste ab (solange sie offen ist, auch im Hintergrund-Tab / als installierte App) und meldet unbekannte Konten.
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* egal */ } };
const NOTIF = { on: lsGet('da.admin.notif', false), timer: null, feed: lsGet('da.admin.feed', []), unseen: 0, every: lsGet('da.admin.every', 30), pushed: false };
// Einstellbare Meldungsarten (gespeichert im Browser). Nur "account" und "cheat" kommen auch per Push bei geschlossener Seite (Datenbank-Trigger), der Rest nur bei offener Seite.
const CFG_DEF = { online: false, onlineMode: 'all', onlineWatch: '', onlineAway: 30, account: true, login: false, loginMode: 'all', returnDays: 7, first: false, join: false, cheat: true, cheatSev: 2, watch: '', errors: true, quiet: false, quietFrom: 23, quietTo: 8, quietCheat: true, digest: 0 };
NOTIF.pending = { online: [], login: [], first: [], join: [] }; NOTIF.onlineN = null; NOTIF.flushAt = Date.now();
function inQuiet() {      // Ruhezeit (Stunden, auch ueber Mitternacht)
  const C = NOTIF.cfg; if (!C.quiet) return false;
  const h = new Date().getHours(), a = +C.quietFrom, b = +C.quietTo;
  return a === b ? false : a < b ? h >= a && h < b : h >= a || h < b;
}
NOTIF.cfg = Object.assign({}, CFG_DEF, lsGet('da.admin.cfg', {}));
const saveCfg = () => lsSet('da.admin.cfg', NOTIF.cfg);
const snapOf = (users) => { const o = {}; for (const u of users) o[u.user_id] = [u.last_sign_in || '', u.saved_at || '', +u.slots || 0, u.optin ? 1 : 0]; return o; };
const nameLink = (n) => '<a href="#" data-open="' + esc(n) + '"><b>' + esc(n) + '</b></a>';
function openPlayer(name) { const u = (S.users || []).find((x) => x.name === name); if (!u) return; S.sel = u.user_id; S.tab = 'players'; renderMain(); }
document.addEventListener('click', (e) => { const a = e.target.closest && e.target.closest('[data-open]'); if (a) { e.preventDefault(); openPlayer(a.dataset.open); } });
window.addEventListener('focus', () => { NOTIF.unseen = 0; document.title = 'DeathArena Admin'; });
document.addEventListener('visibilitychange', () => { if (!document.hidden) pollNew(); });
function beep() {
  try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.value = 880; g.gain.value = 0.08; o.connect(g); g.connect(c.destination); o.start(); o.frequency.setValueAtTime(1175, c.currentTime + 0.12); o.stop(c.currentTime + 0.3); } catch (e) { /* egal */ }
}
// Eine Meldung ueberall: Toast, Ton, Tab-Titel, System-Popup (tag ersetzt gleiche Meldungen, auch die per Push eingetroffenen)
function notify(title, body, tag, loud) {
  const quiet = inQuiet() && !(loud && NOTIF.cfg.quietCheat);      // Ruhezeit: nur in den Verlauf und den Tab-Titel, kein Ton/Popup (Cheat-Meldungen auf Wunsch trotzdem)

function drawStats() {
  const f = S.stat, el = $('#sbody'); if (!el) return;
  if (f.sub === 'saves') { if (S.allSaves) drawSaves(el); return; }
  if (!S.logs) return;
  if (f.sub === 'balance') { el.innerHTML = balanceHtml(); return; }
  const { deaths, bosses } = statSets(), a = analyze(deaths);
  let h = '<div class="muted" style="margin-bottom:8px">' + fmtN(S.logs.length) + ' log entries loaded, ' + a.n + ' runs and ' + bosses.length + ' boss fights match the filter. Only runs of logged-in players are uploaded.</div>';
  if (!deaths.length && !bosses.length) h += '<div class="card muted">No data for this filter yet. Players upload their runs when they are in the main menu while logged in (needs the updated game).</div>';
  else if (f.sub === 'overview') {
    h += '<div class="kpis">' + [['Runs', a.n], ['Wins', a.wins], ['Gave up', a.gaveUp], ['Median time', fmtT(a.median)], ['25% / 75%', fmtT(a.p25) + ' / ' + fmtT(a.p75)], ['Average', fmtT(a.avg)], ['Best', fmtT(a.best)], ['Avg bosses', a.bossAvg.toFixed(1)], ['Avg level', a.lvAvg ? a.lvAvg.toFixed(1) : '-']].map(([l, v]) => '<div class="kpi"><b>' + v + '</b><span>' + l + '</span></div>').join('') + '</div>' +
      '<h2>Deaths over time</h2>' + chart(a);
    const worst = a.windows.filter((w) => w.risk >= 5).sort((x, y) => y.hazard - x.hazard)[0];
    const kb = a.killList[0], bb = analyzeBosses(bosses).filter((b) => b.n >= 3).sort((x, y) => (x.win / x.n) - (y.win / y.n))[0];
    h += '<h2>In words</h2><div class="card"><ul>' + (worst ? '<li>Riskiest window: <b>' + fmtT(worst.lo) + ' - ' + fmtT(worst.lo + WINDOW) + '</b> (' + pct(worst.hazard) + ' of the runs that got there die in it).</li>' : '') +
      (kb ? '<li>Most deaths: <b>' + esc(kb.name) + '</b> (' + kb.n + ' of ' + (a.n - a.wins) + ', median ' + fmtT(kb.med) + ').</li>' : '') +
      (bb ? '<li>Hardest boss: <b>' + esc(BOSS_NAMES[bb.ty] || bb.ty) + '</b> (' + pct(bb.win / bb.n) + ' win rate over ' + bb.n + ' fights).</li>' : '') +
      '<li>Balance values live in <code>js/config.js</code> (enemy, boss, waves).</li></ul></div>';
  } else if (f.sub === 'killers') {
    h += '<div class="card">' + (a.killList.length ? bars(a.killList.map((k) => [k.name, k.n, k.n + ' deaths (' + pct(k.n / Math.max(1, a.n - a.wins)) + '), median ' + fmtT(k.med) + (k.who ? '  -  ' + k.who : '')])) : '<span class="muted">No deaths.</span>') + '</div>';
  } else if (f.sub === 'bosses') {
    const b = analyzeBosses(bosses);
    h += '<div class="card" style="overflow:auto"><table><tr><th>BOSS</th><th>FIGHTS</th><th>WIN RATE</th><th>WON</th><th>DIED</th><th>TIMEOUT</th><th>AVG DURATION</th><th>AVG DAMAGE TAKEN</th><th>STARTS AT</th><th>BEATEN BY</th><th>DIED MOST</th></tr>' +
      b.map((x) => '<tr><td><b>' + esc(BOSS_NAMES[x.ty] || x.ty) + '</b></td><td>' + x.n + '</td><td>' + pct(x.win / x.n) + '</td><td>' + x.win + '</td><td>' + x.died + '</td><td>' + x.timeout + '</td><td>' + x.dur.toFixed(1) + ' s</td><td>' + Math.round(x.dm) + '</td><td>' + fmtT(x.at) + '</td><td>' + esc(x.wonBy || '-') + '</td><td>' + esc(x.diedTo || '-') + '</td></tr>').join('') + '</table></div>';
  } else if (f.sub === 'builds') {
    const b = analyzeBuilds(a.runs).sort((x, y) => y.n - x.n), part = (p, t) => '<div class="card"><h3>' + t + '</h3><table><tr><th>ITEM</th><th>RUNS</th><th>MEDIAN SURVIVAL</th><th>AVERAGE</th></tr>' + b.filter((x) => x.id.startsWith(p)).map((x) => '<tr><td>' + esc(x.id.slice(2).toUpperCase()) + '</td><td>' + x.n + '</td><td>' + fmtT(x.med) + '</td><td>' + fmtT(x.avg) + '</td></tr>').join('') + '</table></div>';
    h += part('w:', 'WEAPONS AND IMPLANTS') + part('a:', 'ABILITIES') + '<div class="muted">Hint only: better players pick other gear, so this shows correlation, not cause.</div>';
  } else if (f.sub === 'players') {
    const by = {}; for (const r of a.runs) (by[r._u] = by[r._u] || []).push(r);
    const rows = Object.keys(by).map((n) => { const x = by[n], t = x.map((r) => r.t).sort((p, q) => p - q); return { n, runs: x.length, wins: x.filter((r) => r.win).length, med: quant(t, .5), best: t[t.length - 1] || 0, lv: avg(x.filter((r) => typeof r.lv === 'number').map((r) => r.lv)) }; }).sort((x, y) => y.runs - x.runs);
    h += '<div class="card" style="overflow:auto"><table><tr><th>PLAYER</th><th>RUNS</th><th>WINS</th><th>MEDIAN</th><th>BEST</th><th>AVG LEVEL</th></tr>' + rows.map((x) => '<tr><td>' + nameLink(x.n) + '</td><td>' + x.runs + '</td><td>' + x.wins + '</td><td>' + fmtT(x.med) + '</td><td>' + fmtT(x.best) + '</td><td>' + (x.lv ? x.lv.toFixed(1) : '-') + '</td></tr>').join('') + '</table></div>';
  } else if (f.sub === 'recent') {
    const rec = deaths.slice().sort((x, y) => String(y._at).localeCompare(String(x._at))).slice(0, 60);
    h += '<div class="card" style="overflow:auto"><table><tr><th>WHEN</th><th>PLAYER</th><th>SLOT</th><th>TIME</th><th>BOSSES</th><th>LV</th><th>RESULT</th><th>KILLS</th><th>GEAR</th></tr>' + rec.map((r) => '<tr><td>' + fmtD(r._at) + '</td><td>' + nameLink(r._u) + '</td><td>' + (r._sl == null ? '-' : r._sl + 1) + '</td><td>' + fmtT(r.t) + '</td><td>' + (r.b || 0) + '</td><td>' + (r.lv || '-') + '</td><td>' + (r.win ? '<span class="ok">WIN</span>' : esc(r.by) + (r.fy ? ' <span class="muted">(' + esc(BOSS_NAMES[r.fy] || r.fy) + ')</span>' : '')) + '</td><td>' + (r.k || 0) + '</td><td class="muted">' + esc([].concat(r.w || [], r.ab || []).filter(Boolean).join(', ')) + '</td></tr>').join('') + '</table></div>';
  }
  el.innerHTML = h;
}

// Anticheat: Verstoesse (tools/supabase_anticheat.sql). Schweregrad 1-3; wer 3 Punkte in 30 Tagen hat, gilt als verdaechtig und steht in keiner Rangliste.
async function viewCheats() {
  const m = $('#main'); m.innerHTML = '<span class="muted">Loading...</span>';
  let list; try { list = await rpc('adm_flags', { p_limit: 300 }); } catch (e) { m.innerHTML = '<span class="err">' + esc(e.message.replace('run tools/supabase_admin.sql', 'run tools/supabase_anticheat.sql')) + '</span>'; return; }
  let trusted = []; try { trusted = (await rpc('adm_ac_trusted', {})).map((t) => t.name); } catch (e) { /* Migration supabase_ac_trust.sql noch nicht ausgefuehrt */ }
  const sus = [...new Set(list.filter((f) => f.suspect).map((f) => f.name))];
  const open = [...new Set(list.filter((f) => !f.cleared).map((f) => f.name))].filter((n) => !sus.includes(n));
  const WHAT = { run_time: 'run longer than real time', run_stats: 'impossible run values', run_quota: 'too many offline runs', save_gain_credits: 'credits gained without runs', save_gain_xp: 'XP gained without runs', save_gain_shards: 'shards gained without a source', save_counters: 'counters above the verified total', save_absurd: 'impossible save (rejected)', save_format: 'unreadable save' };
  const chip = (n, cls) => '<span class="tag ' + cls + '">' + esc(n) + '</span> <button class="small" data-clear="' + esc(n) + '">CLEAR</button> <button class="small" data-trust="' + esc(n) + '">TRUST</button>';
  const grp = {}; for (const f of list) if (!f.cleared) (grp[f.name] = grp[f.name] || []).push(f);
  const queue = Object.keys(grp).sort((a, b) => (sus.includes(b) - sus.includes(a)) || Math.max(...grp[b].map((f) => f.sev)) - Math.max(...grp[a].map((f) => f.sev)) || grp[b].length - grp[a].length);
  const reasons = (fl) => { const c = {}; for (const f of fl) c[f.code] = (c[f.code] || 0) + 1; return Object.keys(c).map((k) => esc(WHAT[k] || k) + (c[k] > 1 ? ' x' + c[k] : '')).join('; '); };
  const queueHtml = '<div class="card"><h3>REVIEW QUEUE (' + queue.length + ')</h3>' + (queue.length ? '<div style="overflow:auto"><table><tr><th>PLAYER</th><th>FLAGS</th><th>MAX SEV</th><th>WHY</th><th>LAST</th><th>DECISION</th></tr>' + queue.map((n) => {
    const fl = grp[n], e = esc(n);
    return '<tr><td>' + nameLink(n) + (sus.includes(n) ? ' <span class="tag err">SUSPECTED</span>' : '') + '</td><td>' + fl.length + '</td><td>' + Math.max(...fl.map((f) => f.sev)) + '</td><td>' + reasons(fl) + '</td><td>' + fmtD(fl[0].at) + '</td><td style="white-space:nowrap"><button data-rv="ok" data-n="' + e + '">LOOKS FINE</button> <button data-rv="trust" data-n="' + e + '">TRUST</button> <button data-rv="take" data-n="' + e + '" class="warn">TAKE CREDITS</button> <button data-rv="lb" data-n="' + e + '" class="warn">LB BAN</button> <button data-rv="block" data-n="' + e + '" class="bad">CHEATER: BLOCK</button></td></tr>';
  }).join('') + '</table></div><div class="muted" style="margin-top:6px">Every decision lands in the ACTION LOG. LOOKS FINE clears the current flags (new ones count again); TAKE CREDITS queues a negative gift for one slot.</div>' : '<span class="muted">No open flags. Nothing to decide.</span>') + '</div>';
  m.innerHTML = queueHtml + '<div class="card"><b>' + (sus.length ? 'SUSPECTED (not on leaderboards): ' + sus.map((n) => chip(n, 'err')).join(' ') : 'Nobody is suspected right now.') + '</b>' +
    (open.length ? '<div style="margin-top:8px">OPEN FLAGS (not suspected yet): ' + open.map((n) => chip(n, '')).join(' ') + '</div>' : '') +
    '<div class="row" style="margin-top:8px"><input type="text" id="acname" placeholder="Account name" style="width:180px"><button id="acclear" class="on">CLEAR FLAGS</button><button id="actrust" class="on">TRUST</button><button id="acuntrust">UNTRUST</button></div>' +
    '<div style="margin-top:8px">TRUSTED (never suspected, flags still logged): ' + (trusted.length ? trusted.map((n) => '<span class="tag ok">' + esc(n) + '</span> <button class="small" data-untrust="' + esc(n) + '">UNTRUST</button>').join(' ') : '<span class="muted">nobody</span>') + '</div>' +
    '<div class="muted" style="margin-top:6px">Severity 1-3, 3 points within 30 days = suspected (removed from leaderboards, no guild rewards). CLEAR marks all current flags of a player as reviewed; new flags count again. TRUST exempts the account from suspicion for good (needs tools/supabase_ac_trust.sql). The leaderboard updates at the next save of that account. An honest player can be flagged after playing offline or with an old app version.</div></div>' +
    '<div class="card" style="overflow:auto"><table><tr><th>WHEN</th><th>PLAYER</th><th>SLOT</th><th>WHAT</th><th>SEV</th><th>DETAIL</th><th>STATE</th></tr>' + (list.length ? list.map((f) => '<tr><td>' + fmtD(f.at) + '</td><td><b>' + esc(f.name) + '</b></td><td>' + (f.slot == null ? '-' : f.slot + 1) + '</td><td>' + esc(WHAT[f.code] || f.code) + '</td><td>' + f.sev + '</td><td class="muted">' + esc(JSON.stringify(f.detail)) + '</td><td>' + (f.cleared ? 'reviewed' : f.suspect ? '<span class="err">suspected</span>' : 'open') + '</td></tr>').join('') : '<tr><td colspan="7" class="muted">No flags yet.</td></tr>') + '</table></div>';
  m.querySelectorAll('[data-rv]').forEach((b) => {
    b.onclick = async () => {
      const n = b.dataset.n, u = (S.users || []).find((x) => x.name === n), v = b.dataset.rv, done = (t, verdict, detail) => rpc('adm_log', { p_user: u ? u.user_id : null, p_action: 'review ' + verdict, p_detail: n + ' ' + (detail || '') }).catch(() => {}).then(() => { toast(t); return viewCheats(); });
      try {
        if (v === 'ok') { await rpc('adm_ac_clear', { p_user_name: n }); await done(n + ': flags cleared', 'ok'); }
        else if (v === 'trust') { await rpc('adm_ac_trust', { p_user_name: n, p_on: true }); await done(n + ' trusted', 'trust'); }
        else if (!u) toast('Account not found (reload first)', true);
        else if (v === 'lb') { await rpc('adm_ban', { p_user: u.user_id, p_on: true }); await done(n + ' banned from leaderboards', 'lb ban'); }
        else if (v === 'block') { if (!confirm('Block ' + n + ' completely (no login, removed from all leaderboards)?')) return; await rpc('adm_block', { p_user: u.user_id, p_on: true, p_reason: 'cheating' }); await done(n + ' blocked', 'block', 'cheating'); }
        else if (v === 'take') {
          const slot = parseInt(prompt('Take credits from which slot (1-3)?', '1'), 10), amt = parseInt(prompt('How many credits to take away?', '1000'), 10);
          if (!(slot >= 1 && slot <= 3) || !(amt > 0)) return;
          await rpc('adm_gift', { p_user: u.user_id, p_slot: slot - 1, p_credits: -amt, p_note: 'admin' }); await done(amt + ' credits queued to be taken from ' + n, 'take credits', '-' + amt + ' slot ' + slot);
        }
      } catch (e) { toast(e.message, true); }
    };
  });
  m.querySelectorAll('[data-clear]').forEach((b) => { b.onclick = () => act('Flags cleared', 'adm_ac_clear', { p_user_name: b.dataset.clear }, viewCheats); });
  m.querySelectorAll('[data-trust]').forEach((b) => { b.onclick = () => act('Account trusted', 'adm_ac_trust', { p_user_name: b.dataset.trust, p_on: true }, viewCheats); });
  m.querySelectorAll('[data-untrust]').forEach((b) => { b.onclick = () => act('Trust removed', 'adm_ac_trust', { p_user_name: b.dataset.untrust, p_on: false }, viewCheats); });
  const nm = () => ($('#acname').value || '').trim().toLowerCase();
  $('#acclear').onclick = () => nm() && act('Flags cleared', 'adm_ac_clear', { p_user_name: nm() }, viewCheats);
  $('#actrust').onclick = () => nm() && act('Account trusted', 'adm_ac_trust', { p_user_name: nm(), p_on: true }, viewCheats);
  $('#acuntrust').onclick = () => nm() && act('Trust removed', 'adm_ac_trust', { p_user_name: nm(), p_on: false }, viewCheats);
}

// ====== Online jetzt (Anwesenheit aus soc_ping, alle 40 s vom Spiel gemeldet; online = vor weniger als 100 s) ======
const ago = (d) => { const s = Math.max(0, Math.round((Date.now() - new Date(d)) / 1000)); return s < 90 ? s + ' s ago' : s < 5400 ? Math.round(s / 60) + ' min ago' : s < 129600 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' d ago'; };
const ACT_TEXT = { run: 'IN A RUN', lobby: 'IN A LOBBY', menu: 'IN THE MENU' };
async function viewOnline() {
  const m = $('#main'); m.innerHTML = '<span class="muted">Loading...</span>';
  const draw = async () => {
    let list; try { list = await rpc('adm_online'); } catch (e) { if (S.tab === 'online') m.innerHTML = '<span class="err">' + esc(e.message) + '</span><div class="muted">Needs tools/supabase_social.sql and tools/supabase_admin2.sql.</div>'; return; }
    if (S.tab !== 'online') return;
    const now = Date.now(), on = list.filter((x) => now - new Date(x.last_seen) < 100000), rest = list.filter((x) => !on.includes(x)), c = (a) => on.filter((x) => x.activity === a).length;
    m.innerHTML = '<div class="kpis">' + [['Online now', on.length], ['In a run', c('run')], ['In a lobby', c('lobby')], ['In the menu', c('menu')], ['Seen in 24 h', list.length]].map(([l, v]) => '<div class="kpi"><b>' + v + '</b><span>' + l + '</span></div>').join('') + '</div>' +
      '<div class="card"><h3>ONLINE NOW</h3><table><tr><th>PLAYER</th><th>DOING</th><th>LAST PING</th></tr>' + (on.length ? on.map((x) => '<tr><td>' + nameLink(x.name) + '</td><td>' + (ACT_TEXT[x.activity] || esc(x.activity)) + '</td><td>' + ago(x.last_seen) + '</td></tr>').join('') : '<tr><td colspan="3" class="muted">Nobody right now.</td></tr>') + '</table></div>' +
      '<div class="card"><h3>SEEN IN THE LAST 24 HOURS</h3><table><tr><th>PLAYER</th><th>LAST SEEN</th></tr>' + (rest.length ? rest.slice(0, 60).map((x) => '<tr><td>' + nameLink(x.name) + '</td><td>' + ago(x.last_seen) + '</td></tr>').join('') : '<tr><td colspan="2" class="muted">-</td></tr>') + '</table></div>' +
      '<div class="muted">Refreshes every 20 s. Only logged-in players in the game version with friends and guilds are listed.</div>';
  };
  await draw(); if (S.tab === 'online') S.liveTimer = setInterval(draw, 20000);
}

// ====== Bindung / Retention ======
// "Rolling" = die letzte bekannte Aktivitaet (Anmeldung, Speichern, Lauf-Protokoll) liegt mindestens N Tage nach der Anmeldung.
// "Genau Tag N" = an genau diesem Tag nach der Anmeldung wurde ein Lauf protokolliert (nur Spieler mit hochgeladenen Laeufen).
async function viewRetention() {
  const m = $('#main'); m.innerHTML = '<span class="muted">Loading...</span>';
  let rows; try { rows = await rpc('adm_retention'); } catch (e) { m.innerHTML = '<span class="err">' + esc(e.message) + '</span><div class="muted">Needs tools/supabase_admin2.sql.</div>'; return; }
  const D = 864e5, now = Date.now(), age = (r) => (now - new Date(r.created_at)) / D, back = (r) => (new Date(r.last_active || r.created_at) - new Date(r.created_at)) / D;
  const Ns = [1, 2, 3, 7, 14, 30], p = (a, b) => (b ? pct(a / b) : '-');
  const real = rows.filter((r) => r.days && r.days.length || back(r) > 0.01);        // Konten, die ueberhaupt etwas getan haben
  const tab = Ns.map((n) => { const el = rows.filter((r) => age(r) >= n), roll = el.filter((r) => back(r) >= n).length, el2 = rows.filter((r) => age(r) >= n + 1), ex = el2.filter((r) => (r.days || []).includes(n)).length; return { n, el: el.length, roll, el2: el2.length, ex }; });
  const wk = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return dayKey(x); };
  const co = {}; for (const r of rows) (co[wk(r.created_at)] = co[wk(r.created_at)] || []).push(r);
  const cohorts = Object.keys(co).sort().reverse().slice(0, 12).map((k) => { const a = co[k], cell = (n) => { const el = a.filter((r) => age(r) >= n); return el.length ? p(el.filter((r) => back(r) >= n).length, el.length) : '-'; }; return '<tr><td>' + k + '</td><td>' + a.length + '</td><td>' + cell(1) + '</td><td>' + cell(7) + '</td><td>' + cell(30) + '</td></tr>'; }).join('');
  const drift = rows.filter((r) => back(r) > 0.01 && now - new Date(r.last_active) > 7 * D && now - new Date(r.last_active) < 30 * D);
  const nm = (id) => { const u = (S.users || []).find((x) => x.user_id === id); return u ? u.name : '?'; };
  const dead = rows.filter((r) => back(r) <= 0.01 && age(r) >= 1).length;
  const d7 = tab.find((x) => x.n === 7);
  m.innerHTML = '<div class="kpis">' + [['Accounts', rows.length], ['Ever active', real.length], ['Never came back', dead], ['Day 1 back', p(tab[0].roll, tab[0].el)], ['Day 7 back', p(d7.roll, d7.el)], ['Day 30 back', p(tab[5].roll, tab[5].el)], ['Drifting away', drift.length]].map(([l, v]) => '<div class="kpi"><b>' + v + '</b><span>' + l + '</span></div>').join('') + '</div>' +
    '<div class="card" style="overflow:auto"><h3>RETENTION BY DAY</h3><table><tr><th>DAY</th><th>ACCOUNTS OLD ENOUGH</th><th>STILL ACTIVE AFTER (ROLLING)</th><th>PLAYED ON EXACTLY THAT DAY</th></tr>' +
    tab.map((x) => '<tr><td>Day ' + x.n + '</td><td>' + x.el + '</td><td>' + x.roll + ' (' + p(x.roll, x.el) + ')</td><td>' + x.ex + ' of ' + x.el2 + ' (' + p(x.ex, x.el2) + ')</td></tr>').join('') + '</table>' +
    '<div class="muted" style="margin-top:6px">Rolling: the last known activity (login, save, uploaded run) is at least N days after sign-up. Exact day: an uploaded run exists on that day, so it only counts players whose runs get uploaded. Use it to judge the new retention features (daily reward, winter event, guilds).</div></div>' +
    '<div class="card" style="overflow:auto"><h3>SIGN-UP WEEKS</h3><table><tr><th>WEEK OF</th><th>NEW</th><th>DAY 1</th><th>DAY 7</th><th>DAY 30</th></tr>' + (cohorts || '<tr><td colspan="5" class="muted">No accounts.</td></tr>') + '</table></div>' +
    '<div class="card"><h3>DRIFTING AWAY (last seen 7-30 days ago)</h3>' + (drift.length ? drift.slice(0, 40).map((r) => nameLink(nm(r.user_id)) + ' <span class="muted">' + ago(r.last_active) + '</span>').join(', ') + '<div class="muted" style="margin-top:6px">A "welcome back" gift in GIFTS &amp; NEWS (audience: active in the last 30 days) reaches them.</div>' : '<span class="muted">Nobody.</span>') + '</div>';
}

// ====== Gilden moderieren ======
async function viewGuilds() {
  const m = $('#main'); m.innerHTML = '<span class="muted">Loading...</span>';
  let list; try { list = await rpc('adm_guilds'); } catch (e) { m.innerHTML = '<span class="err">' + esc(e.message) + '</span><div class="muted">Needs tools/supabase_social.sql and tools/supabase_admin2.sql.</div>'; return; }
  m.innerHTML = '<div class="kpis">' + [['Guilds', list.length], ['Members', list.reduce((s, g) => s + g.members, 0)], ['Points this week', fmtN(list.reduce((s, g) => s + g.week_points, 0))]].map(([l, v]) => '<div class="kpi"><b>' + v + '</b><span>' + l + '</span></div>').join('') + '</div>' +
    '<div class="card" style="overflow:auto"><table><tr><th>#</th><th>GUILD</th><th>LEADER</th><th>MEMBERS</th><th>WEEK</th><th>TOTAL</th><th>CREATED</th><th></th></tr>' +
    (list.length ? list.map((g, i) => '<tr class="pick ' + (S.guildSel === g.id ? 'sel' : '') + '" data-g="' + g.id + '"><td>' + (i + 1) + '</td><td><b>' + esc(g.name) + '</b> <span class="tag">' + esc(g.tag) + '</span></td><td>' + nameLink(g.leader_name) + '</td><td>' + g.members + '</td><td>' + fmtN(g.week_points) + '</td><td>' + fmtN(g.total_points) + '</td><td>' + fmtD(g.created_at) + '</td><td style="white-space:nowrap"><button data-gr="' + g.id + '" class="warn">RENAME</button> <button data-gd="' + g.id + '" class="bad">DELETE</button></td></tr>').join('') : '<tr><td colspan="8" class="muted">No guilds yet.</td></tr>') + '</table></div><div id="gdetail"></div>';
  const byId = (id) => list.find((g) => String(g.id) === String(id));
  m.querySelectorAll('tr.pick').forEach((tr) => { tr.onclick = async (e) => { if (e.target.closest('button,a')) return; S.guildSel = +tr.dataset.g; await showGuild(S.guildSel); }; });
  m.querySelectorAll('[data-gr]').forEach((b) => { b.onclick = (e) => { e.stopPropagation(); const g = byId(b.dataset.gr), n = prompt('New guild name (3-20 letters, numbers, space, _ or -):', g.name); if (n === null) return; const t = prompt('New tag (2-4 letters/numbers):', g.tag); if (t === null) return; act('Guild renamed', 'adm_guild_rename', { p_id: g.id, p_name: n, p_tag: t }, viewGuilds); }; });
  m.querySelectorAll('[data-gd]').forEach((b) => { b.onclick = (e) => { e.stopPropagation(); const g = byId(b.dataset.gd); if (confirm('Delete guild "' + g.name + '" with all ' + g.members + ' members\' memberships and points?')) act('Guild deleted', 'adm_guild_delete', { p_id: g.id }, viewGuilds); }; });
  if (S.guildSel && byId(S.guildSel)) showGuild(S.guildSel);
}
async function showGuild(id) {
  const el = $('#gdetail'); if (!el) return;
  let mem; try { mem = await rpc('adm_guild_members', { p_id: id }); } catch (e) { el.innerHTML = '<span class="err">' + esc(e.message) + '</span>'; return; }
  document.querySelectorAll('tr.pick[data-g]').forEach((tr) => tr.classList.toggle('sel', tr.dataset.g === String(id)));
  el.innerHTML = '<div class="card"><h3>MEMBERS</h3><table><tr><th>PLAYER</th><th>ROLE</th><th>WEEK POINTS</th><th>JOINED</th><th></th></tr>' + mem.map((x) => '<tr><td>' + nameLink(x.name) + '</td><td>' + (x.is_leader ? 'LEADER' : 'member') + '</td><td>' + fmtN(x.week_points) + '</td><td>' + fmtD(x.joined_at) + '</td><td>' + (x.is_leader ? '' : '<button data-k="' + x.user_id + '" class="bad">KICK</button>') + '</td></tr>').join('') + '</table></div>';
  el.querySelectorAll('[data-k]').forEach((b) => { b.onclick = () => { if (confirm('Remove this player from the guild?')) act('Member removed', 'adm_guild_kick', { p_user: b.dataset.k }, () => showGuild(id)); }; });
}

// ====== Fehlerprotokoll aus dem Spiel (js/errlog.js) ======
async function viewErrors() {
  const m = $('#main'); m.innerHTML = '<span class="muted">Loading...</span>';
  let list; try { list = await rpc('adm_errors'); } catch (e) { m.innerHTML = '<span class="err">' + esc(e.message) + '</span><div class="muted">Needs tools/supabase_admin2.sql.</div>'; return; }
  const total = list.reduce((s, e) => s + e.n, 0);
  m.innerHTML = '<div class="row"><span class="muted">' + list.length + ' different errors, ' + total + ' times in total. The game reports each error anonymously (no name, no save), at most 5 per session.</span><span style="flex:1"></span>' + (list.length ? '<button id="ecl" class="warn">CLEAR ALL</button>' : '') + '</div>' +
    '<div class="card" style="overflow:auto"><table><tr><th>LAST</th><th>x</th><th>MESSAGE</th><th>WHERE</th><th>DEVICE</th><th>VERSION</th><th></th></tr>' +
    (list.length ? list.map((e) => '<tr><td>' + fmtD(e.last_at) + '<div class="muted" style="font-size:12px">first ' + fmtD(e.first_at) + '</div></td><td><b>' + e.n + '</b></td><td class="err">' + esc(e.msg) + '</td><td class="muted">' + esc(e.ctx) + '</td><td class="muted" style="font-size:12px">' + esc(e.ua) + '</td><td class="muted">' + esc(e.ver) + '</td><td><button data-e="' + e.id + '">CLEAR</button></td></tr>').join('') : '<tr><td colspan="7" class="muted">No errors reported. Good.</td></tr>') + '</table></div>';
  m.querySelectorAll('[data-e]').forEach((b) => { b.onclick = () => act('Cleared', 'adm_errors_clear', { p_id: +b.dataset.e }, viewErrors); });
  const c = $('#ecl'); if (c) c.onclick = () => { if (confirm('Delete all error entries?')) act('All cleared', 'adm_errors_clear', {}, viewErrors); };
}

// ====== Start ======
(async function () {
  let k = '';
  // Auto-Login: admin.html#password=<Schluessel> (der Teil nach # geht nie an den Server) oder admin.html?password=<Schluessel>; danach verschwindet er aus der Adressleiste
  try {
    const m = /[#?&]password=([^&#]+)/.exec(location.hash + '&' + location.search);
    if (m) { k = decodeURIComponent(m[1]).trim(); history.replaceState(null, '', location.pathname); }
  } catch (e) { /* egal */ }
  if (!k) k = store.get();
  if (k) { KEY = k; try { S.users = await rpc('adm_users'); store.set(k); return renderMain(); } catch (e) { KEY = ''; if (/wrong admin password/i.test(e.message)) store.del(); return renderLogin(e.message); } }
  renderLogin();
})();
</script>
